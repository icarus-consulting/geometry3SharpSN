name: Build and publish package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build signed NuGet package
        shell: powershell
        run: .\build.ps1 --target Pack

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and publish NuGet package
        shell: powershell
        run: .\build.ps1 --target Publish --package-version "${{ github.ref_name }}"
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}